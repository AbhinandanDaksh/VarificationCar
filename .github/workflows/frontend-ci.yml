name: Frontend CI

on:
  push:
    branches: [dev, main]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build check
        working-directory: ./frontend
        run: npm run build
